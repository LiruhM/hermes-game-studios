  - { target: ".hermes/memory/active.md", link: "production/session-state/active.md" }
  - { target: ".hermes/memory/session-logs", link: "production/session-logs" }

# CI/CD
ci:
  provider: "github"
  workflows:
    - "ci.yml"

# Legacy Compatibility
legacy:
  claude_md: "CLAUDE.md"           # Redirects to HERMES.md
  settings_json: ".claude/settings.json"  # Redirects to .hermes/settings.json