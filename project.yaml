# Hermes Game Studios — Machine-Readable Project Configuration
# Source of truth for engine, specialists, modes, paths, and contracts

project:
  name: "Hermes Game Studios"
  version: "0.1.0"
  description: "Native Hermes (Nous Research) game development studio template"
  owner: "Matheus"
  created: "2026-11-09"

# Engine Configuration (RESOLVES CODE ROOTS)
engine:
  name: "godot"                    # godot | unity | unreal
  version: "4.3"
  code_root: "src/"                # Auto-resolved per engine
  test_root: "tests/"              # Auto-resolved per engine
  assets_root: "assets/"           # Auto-resolved per engine
  godot:
    version: "4.3"
    language: "gdscript"           # gdscript | csharp
    gdextension: false
  unity:
    version: "2022.3"
    script_backend: "csharp"
    addressables: true
    dots: false
  unreal:
    version: "5.4"
    cpp_standard: "C++20"
    gas: true
    replication: true

# Model Tiers (Hermes Native)
model_tiers:
  architecture: "nvidia/nemotron-3-ultra"    # opus-equivalent (Directors)
  implementation: "nvidia/nemotron-3-ultra"  # sonnet-equivalent (Specialists)
  inherit: "nvidia/nemotron-3-ultra"         # Session parent (default)

# Review Mode (Controls Gate Execution)
review_mode:
  current: "full"                  # solo | lean | full
  # solo:    SKIP all phase gates, SKIP all director gates
  # lean:    Phase gates only, PR minimal, TD+PR standard, all 4 full
  # full:    All phase gates, All 4 directors at every phase gate

# Sector Configuration
sectors:
  nephy:
    chief: "Nephy-Arquitetura"
    domain: "Architecture & Design"
    agents: ["creative-director", "technical-director", "art-director", "audio-director", "narrative-director", "game-designer", "level-designer", "systems-designer", "ux-designer", "writer", "world-builder"]
    owns: ["docs/architecture/**", "design/gdd/**", "design/registry/**", ".hermes/agents/**", ".hermes/skills/hermes-architecture-*", ".hermes/skills/hermes-design-*", "HERMES.md", "AGENTS.md", "project.yaml"]
    readonly: ["design/narrative/**", "design/levels/**", "design/balance/**", "assets/**", "docs/engine-reference/**"]
  morgana:
    chief: "Morgana-Implementacao"
    domain: "Implementation & Code"
    agents: ["lead-programmer", "godot-specialist", "godot-gdscript-specialist", "godot-csharp-specialist", "godot-shader-specialist", "godot-gdextension-specialist", "unity-specialist", "unity-ui-specialist", "unity-shader-specialist", "unity-dots-specialist", "unity-addressables-specialist", "unreal-specialist", "ue-blueprint-specialist", "ue-gas-specialist", "ue-replication-specialist", "ue-umg-specialist", "gameplay-programmer", "engine-programmer", "ai-programmer", "network-programmer", "tools-programmer", "ui-programmer", "technical-artist", "sound-designer", "prototyper"]
    owns: ["src/**/*.gd", "src/**/*.cs", "Assets/**/*.cs", "Source/**/*.cpp", "Source/**/*.h", "tests/**/*", "tools/**/*", "prototypes/**/*"]
    readonly: ["design/narrative/**", "design/levels/**", "design/balance/**", "assets/**", "docs/engine-reference/**", "docs/architecture/**", "design/gdd/**"]
    forbidden: ["docs/architecture/**", "design/gdd/**", "design/registry/**", ".hermes/agents/**", "HERMES.md", "project.yaml"]
  debora:
    chief: "Debora-Qualidade"
    domain: "QA, Tests, Validation"
    agents: ["qa-lead", "qa-tester", "performance-analyst", "security-engineer", "accessibility-specialist"]
    owns: []  # Debora validates, doesn't own production files
    readonly: ["**/*"]  # Reads everything for validation
  alice:
    chief: "Alice-Curadoria"
    domain: "Knowledge, Research, Docs"
    agents: []  # Alice is a service provider, not a dispatched agent
    services: ["vault_para", "mempalace", "memory_substrate", "research", "skill_authoring"]
    vault_path: "~/Hermes_Brain"
    mempalace_endpoint: "http://localhost:8765"
    memory_substrate_api: "http://127.0.0.1:8766"
  liruh:
    chief: "Liruh-Operacao"
    domain: "Production, Ops, Release"
    agents: ["producer", "economy-designer", "localization-lead", "live-ops-designer", "devops-engineer", "analytics-engineer", "community-manager", "release-manager"]
    services: ["sprint_management", "milestone_management", "release_management", "risk_management", "coordination", "session_management"]
    ntfy_topic: "hermes-mathe-r8gemiyxxm"

