contract_version: "1.0"
issued_by: "Morgana-Implementacao"
issued_at: "2026-11-09T14:00:00Z"
related_arch_contract: "arch-to-impl.yaml.v1"

deliverables:
  - path: "src/core/game_system.gd"
    lines: 247
    interfaces_implemented: ["GameSystemInterface"]
    tests_written: ["test_game_system_interface.gd"]
    test_coverage_pct: 87

  - path: "src/core/save_load.gd"
    lines: 189
    interfaces_implemented: ["SaveLoadInterface"]
    tests_written: ["test_save_load_interface.gd"]
    test_coverage_pct: 92

  - path: "src/audio/audio_manager.gd"
    lines: 156
    interfaces_implemented: ["AudioInterface"]
    tests_written: ["test_audio_interface.gd"]
    test_coverage_pct: 78

validation_requests:
  - type: "interface_conformance"
    target: "src/core/game_system.gd"
    contract: "arch-to-impl.yaml#interfaces.GameSystemInterface"
    expected: "PASS"

  - type: "interface_conformance"
    target: "src/core/save_load.gd"
    contract: "arch-to-impl.yaml#interfaces.SaveLoadInterface"
    expected: "PASS"

  - type: "interface_conformance"
    target: "src/audio/audio_manager.gd"
    contract: "arch-to-impl.yaml#interfaces.AudioInterface"
    expected: "PASS"

  - type: "quality_gates"
    target: "src/**/*.gd"
    gates: ["max_lines_per_file", "no_direct_console", "no_direct_data_access"]
    expected: "PASS"

  - type: "test_execution"
    target: "tests/**/*.gd"
    command: "godot --headless --script "
    expected_exit_code: 0

  - type: "cross_boundary_check"
    forbidden_paths:
      - "docs/architecture/**"
      - "design/gdd/**"
      - ".hermes/agents/**"
      - "HERMES.md"
      - "project.yaml"
    expected: "NO_VIOLATIONS"

test_artifacts:
  - "tests/unit/test_game_system_interface.gd"
  - "tests/unit/test_save_load_interface.gd"
  - "tests/unit/test_audio_interface.gd"
  - "tests/integration/test_system_integration.gd"
  - "tests/performance/test_frame_budget.gd"

performance_budgets:
  - system: "game_system"
    max_frame_ms: 2.0
    max_memory_mb: 50

  - system: "save_load"
    max_save_ms: 100
    max_load_ms: 200
    max_memory_mb: 10

  - system: "audio_manager"
    max_frame_ms: 0.5
    max_memory_mb: 20
    max_concurrent_voices: 32

handoff_protocol:
  1: "Morgana completes implementation + tests"
  2: "Morgana runs quality gates locally (pre-commit)"
  3: "Morgana writes .hermes/contracts/impl-to-qa.yaml"
  4: "Morgana notifies Liruh: 'PRONTO PARA QA - contrato em impl-to-qa.yaml'"
  5: "Liruh dispatches Debora with contract impl-to-qa.yaml"
  6: "Debora validates EVERYTHING in contract (interface, gates, tests, performance)"
  7: "Debora writes .hermes/contracts/qa-report.yaml with verdict"
  8: "If PASS -> Liruh authorizes next phase"
  9: "If FAIL -> Debora lists EXACT blockers, Morgana fixes, re-delivers"
