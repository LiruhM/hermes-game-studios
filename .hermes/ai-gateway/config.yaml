# Hermes AI Gateway Configuration
# Adapted from OmniRoute for Hermes Game Studios
# Free-tier providers only: NVIDIA (subscription), Groq (API key), Pollinations (free, no key)

server:
  host: "127.0.0.1"
  port: 20128
  cors: true
  dashboard_port: 20129

routing:
  default_strategy: "auto"
  strategies:
    - name: "priority"
      description: "First-target ordered list - drain each before next"
    - name: "fill-first"
      description: "Fill each target's quota fully before moving on"
    - name: "weighted"
      description: "Weighted random by per-target weight"
    - name: "round-robin"
      description: "Cycle through targets in order"
    - name: "p2c"
      description: "Power-of-two-choices random load balancing"
    - name: "least-used"
      description: "Pick target with lowest current load"
    - name: "random"
      description: "Pure random"
    - name: "strict-random"
      description: "Random but respecting enabled/disabled"
    - name: "cost-optimized"
      description: "Cheapest per token first"
    - name: "headroom"
      description: "Most quota/rate-limit headroom first"
    - name: "reset-window"
      description: "Aware of provider quota reset windows"
    - name: "reset-aware"
      description: "Similar to reset-window"
    - name: "context-relay"
      description: "Relay context across providers"
    - name: "context-optimized"
      description: "Optimize for context window"
    - name: "cache-optimized"
      description: "Optimize for KV cache hits"
    - name: "lkgp"
      description: "Last Known Good Provider - sticks to your last working provider"
    - name: "auto"
      description: "Balanced default (LKGP)"
    - name: "fusion"
      description: "Multi-provider fusion"
    - name: "pipeline"
      description: "Sequential pipeline"

providers:
  # Tier 1: Subscription (existing NVIDIA key)
  - name: "nvidia"
    type: "subscription"
    base_url: "https://integrate.api.nvidia.com/v1"
    api_key_env: "NVIDIA_API_KEY"
    models:
      - "nemotron-3-ultra-550b-a55b"
      - "moonshotai/kimi-k3"
    priority: 1
    enabled: true
    health_check: true
    max_consecutive_failures: 3
    cost_per_million_tokens: 0.0

  # Tier 2: API Key - Groq (user provided)
  - name: "groq"
    type: "api_key"
    base_url: "https://api.groq.com/openai/v1"
    api_key: "${GROQ_API_KEY}"
    models:
      - "openai/gpt-oss-120b"
      - "openai/gpt-oss-20b"
    priority: 10
    enabled: true
    health_check: true
    max_consecutive_failures: 3
    cost_per_million_tokens: 0.0

  # Tier 4: Free - Pollinations (confirmed working, no key needed)
  - name: "pollinations"
    type: "free"
    base_url: "https://text.pollinations.ai/openai"
    models:
      - "openai-fast"
    priority: 100
    enabled: true
    no_key: true
    health_check: true
    max_consecutive_failures: 10
    cost_per_million_tokens: 0.0

compression:
  enabled: true
  proxy_url: "http://localhost:8787/v1"

dashboard:
  enabled: true
  port: 20129
  path: "/dashboard"

resilience:
  circuit_breaker:
    enabled: true
    failure_threshold: 5
    success_threshold: 2
    timeout_seconds: 30
    half_open_max_calls: 3
    excluded_status_codes: [400, 401, 403, 404]
    metrics_window_seconds: 60
    min_calls_before_evaluate: 3
    provider_overrides:
      nvidia:
        failure_threshold: 5
        timeout_seconds: 30
      groq:
        timeout_seconds: 20
      pollinations:
        failure_threshold: 10
        success_threshold: 3
        timeout_seconds: 60
        half_open_max_calls: 5

  key_cooldown:
    enabled: true
    cooldown_seconds: 60

  model_lockout:
    enabled: true
    max_failures: 3

  fallback:
    enabled: true
    triggers:
      - "rate_limit"
      - "server_error"
      - "timeout"
      - "connection_error"
      - "circuit_open"
      - "auth_failure"
      - "quota_exhausted"
    skip_same_backend: true
    skip_same_credential: true
    skip_same_endpoint: true
    reset_on_success: true
    max_fallback_attempts_per_turn: 5
    log_fallback_events: true