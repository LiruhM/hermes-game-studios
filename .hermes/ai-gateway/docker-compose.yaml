version: '3.8'

services:
  hermes-ai-gateway:
    image: diegosouzapw/omniroute:latest
    container_name: hermes-ai-gateway
    restart: unless-stopped
    ports:
      - "20128:20128"
      - "20129:20129"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ai-gateway-data:/data
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - NVIDIA_API_KEY=${NVIDIA_API_KEY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:20128/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  ai-gateway-data: