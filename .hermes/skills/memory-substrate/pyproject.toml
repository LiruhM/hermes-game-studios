[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "memory-substrate"
version = "1.0.0"
description = "Unified Memory Layer — Vault (Obsidian PARA) + MemPalace + Skills"
readme = "SKILL.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "pydantic>=2.5.0",
    "sentence-transformers>=2.2.0",
    "numpy>=1.24.0",
    "networkx>=3.1",
    "sqlite-vec>=0.1.0",
    "httpx>=0.25.0",
    "aiofiles>=23.2.0",
    "pyyaml>=6.0",
    "watchdog>=3.0.0",
    "croniter>=2.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["memory_substrate*"]